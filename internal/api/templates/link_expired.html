<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link expirado</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; margin: 0; padding: 1.5rem;
        background: #f5f7fa;
      }
      .card {
        max-width: 28rem; background: #ffffff; padding: 2rem;
        border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        text-align: center;
      }
      h1 { color: #c0392b; margin-top: 0.5rem; }
      p { color: #2c3e50; line-height: 1.5; }
      .icon {
        width: 64px; height: 64px; border-radius: 50%;
        background: #c0392b; color: #fff; font-size: 2rem; line-height: 64px;
        margin: 0 auto;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1419; }
        .card { background: #1a212b; }
        p { color: #cbd5e1; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">!</div>
      <h1>Link expirado</h1>
      <p>Esse link de conexão já expirou ou foi usado.</p>
      <p>Volte ao WhatsApp, envie qualquer mensagem e o assistente te enviará um novo link.</p>
    </div>
  </body>
</html>
